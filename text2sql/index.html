<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text2SQL 智能查询</title>
<style>
  :root{
    --primary:#185FA5; --primary-soft:#E6F1FB; --bg:#f4f6f9; --card:#fff;
    --border:#e1e6ed; --text:#2C2C2A; --muted:#5F5E5A; --hint:#888780;
    --code-bg:#0d1117; --code-text:#79c0ff; --danger:#A32D2D; --warn:#854F0B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;}
  .app{display:flex;min-height:100vh;}
  /* 左侧历史 */
  #sidebar{width:340px;flex:0 0 340px;background:#fff;border-right:1px solid var(--border);
           display:flex;flex-direction:column;height:100vh;position:sticky;top:0;}
  .side-head{display:flex;align-items:center;justify-content:space-between;
             padding:14px 16px;border-bottom:1px solid var(--border);font-weight:500;}
  #historyList{flex:1;overflow:auto;padding:10px;}
  .hist{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .hist:hover{border-color:var(--primary);background:var(--primary-soft);}
  .hist-q{font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-sql{font-family:monospace;font-size:11px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
  .hist-meta{font-size:11px;color:var(--muted);}
  .link{background:none;border:none;color:var(--primary);cursor:pointer;font-size:12px;}
  /* 右侧主区 */
  #main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:#fff;}
  .title{font-size:18px;font-weight:500;}
  .subtitle{font-size:12px;color:var(--hint);margin-top:2px;}
  .status{font-size:12px;color:var(--muted);}
  .input-row{padding:16px 24px;display:flex;gap:12px;align-items:flex-start;background:#fff;border-bottom:1px solid var(--border);}
  #question{flex:1;height:64px;resize:vertical;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;}
  .btns{display:flex;flex-direction:column;gap:8px;}
  button{padding:9px 18px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;font-size:14px;}
  button.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  button:hover{opacity:.92;}
  #result{padding:18px 24px;max-width:1100px;width:100%;}
  .card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px 16px;margin-bottom:14px;}
  .card-h{font-weight:500;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .card-h.pointer{cursor:pointer;}
  .muted{color:var(--hint);font-weight:400;font-size:12px;}
  .code{background:var(--code-bg);color:var(--code-text);padding:10px 12px;border-radius:6px;
         font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0;}
  .code.sm{font-size:11px;}
  .prose{color:var(--muted);line-height:1.6;}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border-bottom:1px solid #eef2f7;padding:7px 10px;text-align:left;white-space:nowrap;}
  th{background:#eef2f7;position:sticky;top:0;}
  tbody tr:hover{background:#fafbfc;}
  .sub{border-top:1px dashed var(--border);padding-top:10px;margin-top:10px;}
  .sub-h{font-weight:500;margin-bottom:6px;color:var(--text);}
  .kv{margin:0;padding-left:18px;}
  .kv li{margin-bottom:6px;}
  .banner{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;}
  .banner.danger{background:#FCEBEB;color:var(--danger);border:1px solid #F09595;}
  .banner.warn{background:#FAEEDA;color:var(--warn);border:1px solid #FAC775;}
  .banner input{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;min-width:220px;}
  .inline-form{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .copy{margin-left:auto;font-size:12px;color:var(--primary);border:1px solid var(--border);
        background:#fff;border-radius:6px;padding:2px 10px;cursor:pointer;}
  @media(max-width:760px){.app{flex-direction:column}.#sidebar{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}#main{height:auto}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar">
    <div class="side-head"><span>历史查询</span><button class="link" onclick="clearHistory()">清空</button></div>
    <div id="historyList"></div>
  </div>
  <div id="main">
    <div class="topbar">
      <div>
        <div class="title">Text2SQL 智能查询</div>
        <div class="subtitle">自然语言 → SQL → 数据（生产环境）</div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="input-row">
      <textarea id="question" placeholder="用自然语言描述你要查的数据，例如：查询所有离线设备的名称"></textarea>
      <div class="btns">
        <button class="primary" onclick="ask()">查询</button>
        <button onclick="exportExcel()">导出 Excel</button>
      </div>
    </div>
    <div id="envBanner"></div>
    <div id="result"></div>
  </div>
</div>

<script>
// 默认后端地址（优先级：localStorage 覆盖 > 自动判断）
//   - 本地双击打开 html（file://）→ 直接打本机 8081（你的 IDEA 后端）
//   - 将来通过 nginx 访问（http/https）→ 自动留空，走同源 /ai/
const API_BASE = (localStorage.getItem('t2s_api_base') || (window.location.protocol==='file:' ? 'http://localhost:8081' : ''));

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pretty(o){try{return typeof o==='string'?o:JSON.stringify(o,null,2);}catch(e){return String(o);}}
function setStatus(s){document.getElementById('status').textContent=s;}

function fullUrl(path){return (API_BASE||window.location.origin)+path;}

function showEnvBanner(html){document.getElementById('envBanner').innerHTML=html||'';}

function initEnv(){
  if(window.location.protocol==='file:'){
    showEnvBanner('<div class="banner warn">'+
      '本地测试模式：请求将发往 <b>'+esc(fullUrl('/ai/sql/generate-detail'))+'</b>（可直接改下面地址，保存生效）。'+
      '<div class="inline-form"><input id="apiBaseInput" placeholder="http://localhost:8081" value="'+esc(API_BASE)+'">'+
      '<button onclick="saveApiBase()">保存并刷新</button></div>'+
      '</div>');
    return;
  }
  // 通过 http(s) 访问（nginx 部署）时给个状态提示
  setStatus('后端: '+fullUrl('/ai/sql/generate-detail'));
}

function saveApiBase(){
  const v=document.getElementById('apiBaseInput').value.trim();
  if(v) localStorage.setItem('t2s_api_base',v);
  else localStorage.removeItem('t2s_api_base');
  window.location.reload();
}

async function ask(reuse){
  const q=(reuse!=null?reuse:document.getElementById('question').value).trim();
  if(!q){alert('请输入问题');return;}
  if(reuse==null)document.getElementById('question').value=q;
  setStatus('查询中…');
  const t0=performance.now();
  const url=fullUrl('/ai/sql/generate-detail');
  try{
    const resp=await fetch(url,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,useBusinessMetric:'true',useQueryPlan:'true',
        useSelfCorrection:'true',useWhereHint:'true',useExemplar:'true',useGlossary:'true',useKnowledge:'true'})
    });
    const data=await resp.json();
    const elapsed=Math.round(performance.now()-t0);
    renderResult(data,q,elapsed);
    const sql=(data.sqlResult&&data.sqlResult.sql)||'';
    const rowCount=Array.isArray(data.data)?data.data.length:0;
    pushHistory({question:q,sql,rowCount,elapsed,token:null,resp:data,time:Date.now()});
    setStatus('完成 · '+elapsed+'ms · '+rowCount+' 行');
  }catch(e){
    setStatus('请求失败');
    document.getElementById('result').innerHTML=renderFetchError(e,url);
  }
}

function renderFetchError(e,url){
  let tips='';
  if(window.location.protocol==='file:'){
    tips='当前是 file:// 本地打开，浏览器禁止发请求。请通过 nginx 访问，或在上方输入后端地址。';
  }else{
    tips='常见原因：① springai 后端没启动；② nginx 的 location /ai/ proxy_pass 端口不对；③ 访问的是 https 页面但请求 http（混合内容）；④ 浏览器插件/防火墙拦截。';
  }
  return '<div class="banner danger"><b>请求失败：'+esc(e.message)+'</b><br>'+
         '<span class="muted">尝试地址：</span>'+esc(url)+'<br>'+
         '<span class="muted">'+esc(tips)+'</span></div>';
}

async function exportExcel(){
  const q=document.getElementById('question').value.trim();
  if(!q){alert('请输入问题');return;}
  setStatus('导出中…');
  const url=fullUrl('/ai/sql/query');
  try{
    const resp=await fetch(url,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,useSelfCorrection:'true'})
    });
    const ct=resp.headers.get('content-type')||'';
    if(ct.indexOf('application/json')>=0){
      const j=await resp.json();
      alert('导出失败：'+(j.message||j.errorType||'未知错误'));
      setStatus('导出失败');
      return;
    }
    const blob=await resp.blob();
    const dl=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=dl;a.download='查询结果_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(dl);
    setStatus('已导出 Excel');
  }catch(e){
    document.getElementById('result').innerHTML=renderFetchError(e,url);
    setStatus('导出异常');
  }
}

function renderResult(data,q,elapsed){
  const box=document.getElementById('result');
  const err=data.errorType;
  let html='';
  if(err==='SAFETY_BLOCKED')html+='<div class="banner danger">安全拦截：该问题被提示注入/越权检测拦下，未执行。</div>';
  else if(err==='EMPTY_RESULT')html+='<div class="banner warn">查询无结果（结果为空）。</div>';

  const sql=(data.sqlResult&&data.sqlResult.sql)||'';
  html+='<div class="card"><div class="card-h">生成的 SQL<span class="copy" onclick="copySql()">复制</span></div>'+
        '<pre class="code" id="sqlPre">'+esc(sql)+'</pre></div>';
  if(data.summary)html+='<div class="card"><div class="card-h">AI 摘要</div><div class="prose">'+esc(data.summary)+'</div></div>';
  // 注：结果数据表（查询结构）按你要求不放在主区，移进「详情」里（默认折叠）
  html+='<div class="card"><div class="card-h pointer" onclick="toggleDetails()">详情 ▾ <span class="muted">结果数据 / 命中知识 / 执行计划 / 安全审计</span></div>'+
        '<div id="details" style="display:none">'+renderDetails(data)+'</div></div>';
  box.innerHTML=html;
}

function renderTable(rows){
  const cols=Object.keys(rows[0]);
  const show=rows.slice(0,200);
  let h='<div class="table-wrap"><table><thead><tr>';
  cols.forEach(c=>h+='<th>'+esc(c)+'</th>');
  h+='</tr></thead><tbody>';
  show.forEach(r=>{h+='<tr>';cols.forEach(c=>{let v=r[c];if(v==null)v='';else if(typeof v!=='string')v=String(v);h+='<td>'+esc(v)+'</td>';});h+='</tr>';});
  h+='</tbody></table></div>';
  return h;
}

function detailSection(title,val){
  if(!val)return '';
  let items;
  if(Array.isArray(val)){if(!val.length)return '';items=val.map(v=>typeof v==='object'?pretty(v):String(v));}
  else if(typeof val==='object'){items=[pretty(val)];}
  else items=[String(val)];
  let h='<div class="sub"><div class="sub-h">'+esc(title)+'（'+items.length+'）</div><ul class="kv">';
  items.forEach(it=>h+='<li><pre class="code sm">'+esc(it)+'</pre></li>');
  h+='</ul></div>';
  return h;
}

function renderDetails(data){
  let h='';
  // 结果数据表（查询结构）：按你要求放到详情里，默认折叠，避免主区太满
  if(Array.isArray(data.data)&&data.data.length){
    h+='<div class="sub"><div class="sub-h">结果数据（显示前 '+Math.min(data.data.length,200)+' 行 / 共 '+data.data.length+' 行）</div>'+renderTable(data.data)+'</div>';
  }
  h+=detailSection('命中范例 (few-shot)',data.matchedExemplars);
  h+=detailSection('命中业务术语',data.matchedTerms);
  h+=detailSection('命中外键/关联',data.matchedForeignKeys);
  h+=detailSection('命中接口映射',data.matchedInterfaceMaps);
  h+=detailSection('命中 WHERE 提示',data.matchedWhereHints);
  h+=detailSection('命中业务口径',data.matchedMetrics);
  if(data.queryPlan)h+='<div class="sub"><div class="sub-h">执行计划 (queryPlan)</div><pre class="code sm">'+esc(pretty(data.queryPlan))+'</pre></div>';
  if(data.safety)h+='<div class="sub"><div class="sub-h">安全审计 (safety)</div><pre class="code sm">'+esc(pretty(data.safety))+'</pre></div>';
  if(!h)h='<div class="muted">无额外详情。</div>';
  return h;
}

function toggleDetails(){const d=document.getElementById('details');if(!d)return;d.style.display=d.style.display==='none'?'block':'none';}
function copySql(){const p=document.getElementById('sqlPre');if(!p)return;navigator.clipboard.writeText(p.textContent).then(()=>setStatus('SQL 已复制'));}

/* ===== 历史（localStorage 客户端保存） ===== */
const HKEY='text2sql_history_v1';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HKEY))||[];}catch(e){return [];}}
function saveHistory(list){localStorage.setItem(HKEY,JSON.stringify(list.slice(0,30)));}
function pushHistory(item){const list=loadHistory();list.unshift(item);saveHistory(list);renderHistory();}
function renderHistory(){
  const list=loadHistory();const el=document.getElementById('historyList');
  if(!list.length){el.innerHTML='<div class="muted" style="padding:12px">暂无历史，查一条试试</div>';return;}
  el.innerHTML=list.map((it,idx)=>{
    const sql=(it.sql||'').replace(/\s+/g,' ').slice(0,90);
    return '<div class="hist" onclick="useHistory('+idx+')">'+
      '<div class="hist-q">'+esc(it.question)+'</div>'+
      '<div class="hist-sql">'+esc(sql||'(无SQL)')+'</div>'+
      '<div class="hist-meta">行数 '+(it.rowCount||0)+' · 耗时 '+(it.elapsed||0)+'ms · token '+(it.token!=null?it.token:'—')+'</div>'+
      '</div>';
  }).join('');
}
function useHistory(idx){const it=loadHistory()[idx];if(!it)return;document.getElementById('question').value=it.question;renderResult(it.resp,it.question,it.elapsed);}
function clearHistory(){localStorage.removeItem(HKEY);renderHistory();}

initEnv();
renderHistory();
document.getElementById('question').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')ask();});
</script>
</body>
</html>
